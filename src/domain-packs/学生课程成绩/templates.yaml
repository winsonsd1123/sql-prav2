# 域包A · 学生-课程-成绩：6 个基础单表查询模板
# 占位符：{{table.X}} 表语义角色 / {{col.表.角色}} 列语义角色 / {{param.X}} 与 {{param.X.子键}} 参数
# 实例化时按种子随机选定实际表名/列名与参数（T5 四层随机化）。
- 模板ID: single-select-all
  知识点: 单表查询
  难度: 1
  题面: 查询所有学生的姓名。
  提示:
    - "思路：只需要一个列，从学生表里全部取出。"
    - "关键子句：SELECT {{col.学生.姓名}} FROM {{table.学生}}"
  参考答案: "SELECT {{col.学生.姓名}} FROM {{table.学生}}"
  ordered: false

- 模板ID: single-select-distinct-city
  知识点: 单表查询
  难度: 1
  题面: 查询学生来自哪些不同的城市（去除重复）。
  提示:
    - "思路：城市有重复值，需要去重后再列出。"
    - "关键子句：SELECT DISTINCT {{col.学生.城市}} FROM {{table.学生}}"
  参考答案: "SELECT DISTINCT {{col.学生.城市}} FROM {{table.学生}}"
  ordered: false

- 模板ID: single-where-score
  知识点: 单表查询
  难度: 2
  题面: "查询成绩不低于 {{param.及格线}} 分的成绩记录，返回学号、课程号与分数。"
  提示:
    - "思路：用 WHERE 条件筛选分数，注意包含等于阈值的情况。"
    - "关键子句：WHERE {{col.成绩.分数}} >= {{param.及格线}}"
  参考答案: "SELECT {{col.成绩.学号}}, {{col.成绩.课程号}}, {{col.成绩.分数}} FROM {{table.成绩}} WHERE {{col.成绩.分数}} >= {{param.及格线}}"
  ordered: false
  参数:
    及格线: [60, 70, 80]

- 模板ID: single-where-city
  知识点: 单表查询
  难度: 2
  题面: "查询生源地或城市为「{{param.城市}}」的学生姓名。"
  提示:
    - "思路：字符串等值筛选用 WHERE 列名 = '关键词'，注意引号。"
    - "关键子句：WHERE {{col.学生.城市}} = '{{param.城市}}'"
  参考答案: "SELECT {{col.学生.姓名}} FROM {{table.学生}} WHERE {{col.学生.城市}} = '{{param.城市}}'"
  ordered: false
  参数:
    城市: [北京, 上海, 广州, 深圳, 杭州, 成都]

- 模板ID: single-order-by-scholarship
  知识点: 单表查询
  难度: 2
  题面: "查询每位学生的姓名与奖学金，按奖学金{{param.排序方向.描述}}排序（奖学金相同时按学号升序）。"
  提示:
    - "思路：排序用 ORDER BY，方向由题面决定。"
    - "关键子句：ORDER BY {{col.学生.奖学金}} {{param.排序方向.SQL}}, {{col.学生.学号}}"
  参考答案: "SELECT {{col.学生.姓名}}, {{col.学生.奖学金}} FROM {{table.学生}} ORDER BY {{col.学生.奖学金}} {{param.排序方向.SQL}}, {{col.学生.学号}}"
  ordered: true
  # 关联参数：中文描述与 SQL 关键字成对取用，保证题面与参考答案方向一致
  参数:
    排序方向:
      - { 描述: 从高到低, SQL: DESC }
      - { 描述: 从低到高, SQL: ASC }

- 模板ID: single-limit-top
  知识点: 单表查询
  难度: 3
  题面: "查询前 {{param.名额}} 名学生（按学号升序）的姓名。"
  提示:
    - "思路：先按学号排序，再限制返回行数。"
    - "关键子句：ORDER BY {{col.学生.学号}} LIMIT {{param.名额}}"
  参考答案: "SELECT {{col.学生.姓名}} FROM {{table.学生}} ORDER BY {{col.学生.学号}} LIMIT {{param.名额}}"
  ordered: true
  参数:
    名额: [3, 5, 7]
